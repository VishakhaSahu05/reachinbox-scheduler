# Production stack for a single VM: API (+ dashboard), worker, databases, and Caddy for HTTPS.
# Usage (from this folder): cp .env.example .env, fill it in, then `docker compose up -d --build`.

# API and worker run from the same image as separate containers. Each runs node as PID 1, so
# `docker compose stop` delivers SIGTERM straight to it and the worker can finish in-flight sends.
x-backend: &backend
  build: ..
  image: reachinbox-app
  env_file: .env
  environment:
    DATABASE_URL: postgresql://reachinbox:${POSTGRES_PASSWORD}@postgres:5432/reachinbox
    REDIS_URL: redis://redis:6379
    ELASTICSEARCH_URL: http://elasticsearch:9200
    # The URL people open. Same as https://DOMAIN, unless a proxy (e.g. Vercel) fronts the server.
    APP_URL: ${PUBLIC_URL}
    FRONTEND_URL: ${PUBLIC_URL}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    # The search index is created on boot, so wait until Elasticsearch answers.
    elasticsearch:
      condition: service_healthy
  restart: unless-stopped

services:
  app:
    <<: *backend
    command: ["sh", "-c", "npx prisma migrate deploy && exec node dist/server.js"]

  worker:
    <<: *backend
    # migrate deploy is idempotent and locked, so both containers can run it safely.
    command: ["sh", "-c", "npx prisma migrate deploy && exec node dist/worker.js"]
    # Time to finish emails that are mid-send before Docker kills the process.
    stop_grace_period: 60s

  caddy:
    image: caddy:2
    # Gets and renews a Let's Encrypt certificate for DOMAIN automatically.
    command: caddy reverse-proxy --from ${DOMAIN} --to app:4000
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
    depends_on:
      - app
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reachinbox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: reachinbox
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reachinbox"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      retries: 30
    restart: unless-stopped

volumes:
  caddy_data:
  pgdata:
  redisdata:
  esdata:
